<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Vitara ร้านอาหารเสริมออนไลน์ เลือกสินค้าที่เหมาะกับคุณด้วยผู้ช่วย AI ส่งฟรีเมื่อซื้อครบ ฿990" />
    <meta name="theme-color" content="#1f6b57" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" />
    <title>Vitara อาหารเสริม</title>
    <style>
      /* Loading screen: inline so it paints before the app bundle arrives */
      #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #f5f7f4; transition: opacity .45s ease, visibility .45s; }
      #splash.done { opacity: 0; visibility: hidden; }
      #splash .sp { display: grid; justify-items: center; gap: 18px; }
      #splash .cap { position: relative; width: 84px; height: 40px; border-radius: 20px; overflow: hidden; transform: rotate(-35deg); animation: sp-spin 1.6s cubic-bezier(.6,0,.3,1) infinite; box-shadow: 0 12px 30px rgba(31,107,87,.25); }
      #splash .cap i { position: absolute; top: 0; bottom: 0; width: 50%; }
      #splash .cap i:first-child { left: 0; background: #1f6b57; }
      #splash .cap i:last-child { right: 0; background: #e2a03a; }
      #splash b { font: 600 26px "Mitr", system-ui, sans-serif; color: #1f6b57; letter-spacing: .02em; opacity: 0; animation: sp-in .5s .15s ease forwards; }
      #splash .bar { width: 140px; height: 3px; border-radius: 3px; background: #dde5dc; overflow: hidden; }
      #splash .bar i { display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #1f6b57, #e2a03a); animation: sp-bar 1.1s ease-in-out infinite; }
      @keyframes sp-spin { 0% { transform: rotate(-35deg); } 50% { transform: rotate(145deg); } 100% { transform: rotate(325deg); } }
      @keyframes sp-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes sp-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @media (prefers-color-scheme: dark) { #splash { background: #0f1715; } #splash b { color: #4fb895; } #splash .bar { background: #2b3b36; } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } #splash b { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp"><span class="cap"><i></i><i></i></span><b>Vitara</b><span class="bar"><i></i></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
